<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Rooftop Cat · Mystery Vinyl</title>
  <meta name="description" content="A one-button pixel runner across a city at night, laid out on the beat of the record that's playing. Jump on the beat for a PERFECT." />
  <meta name="theme-color" content="#07081a" />
  <link rel="canonical" href="https://fm.uiboy.com/rooftop" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Mystery Vinyl" />
  <meta property="og:title" content="Rooftop Cat · Mystery Vinyl" />
  <meta property="og:description" content="Run across the rooftops on the beat of the record. The level is built from the song." />
  <meta property="og:url" content="https://fm.uiboy.com/rooftop" />
  <meta property="og:image" content="https://fm.uiboy.com/assets/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23E8D7C0'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%23000'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23E8D7C0'/%3E%3Ccircle cx='32' cy='32' r='1.6' fill='%23000'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="rooftop.css" />
</head>
<body class="rt">
  <canvas class="rt-game" id="game" aria-label="Rooftop cat: a cat running across the rooftops at night"></canvas>

  <header class="rt-hud">
    <div class="rt-left">
      <a class="rt-home nav-btn" href="./" aria-label="Back to Mystery Vinyl" data-tip="Back to the deck"><svg aria-hidden="true"><use href="assets/pixelarticons.svg#arrow-bar-left"></use></svg></a>
      <div class="rt-scorebox">
        <span class="rt-score" id="score">0</span>
        <span class="rt-best">best <b id="best">0</b></span>
      </div>
    </div>
    <div class="rt-right">
      <div class="rt-moods" id="moods" aria-label="Music"></div>
      <div class="rt-radio">
        <div class="rt-now"><span class="rt-title" id="title">Picking a record…</span><span class="rt-artist"><span id="artist">&nbsp;</span> · <span id="bpm">listening…</span></span></div>
        <button class="btn px rt-btn" id="prev" aria-label="Previous record"><svg aria-hidden="true"><use href="assets/pixelarticons.svg#arrow-bar-left"></use></svg></button>
        <button class="btn px rt-btn" id="play" aria-label="Play or pause the music"><svg class="ic-play" aria-hidden="true"><use href="assets/pixelarticons.svg#play"></use></svg><svg class="ic-pause" aria-hidden="true"><use href="assets/pixelarticons.svg#pause-solid"></use></svg></button>
        <button class="btn px rt-btn" id="next" aria-label="Next record"><svg aria-hidden="true"><use href="assets/pixelarticons.svg#arrow-bar-right"></use></svg></button>
      </div>
    </div>
  </header>

  <div class="rt-card px px-lg" id="card" hidden>
    <h1 id="card-title">Rooftop cat</h1>
    <p id="card-text"></p>
    <button class="rt-go px" id="go">Start</button>
    <p class="rt-keys">space / tap · jump &nbsp;·&nbsp; hold · higher &nbsp;·&nbsp; N · next record</p>
  </div>

  <p class="rt-credit" id="credit"></p>
  <audio id="audio" crossorigin="anonymous" preload="auto"></audio>
  <script src="pixel.js"></script>
  <script src="rooftop.js"></script>
</body>
</html>
