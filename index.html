<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mystery Vinyl</title>
  <meta name="description" content="Drop the needle. Random records for coding, focus, thinking and designing." />
  <meta name="theme-color" content="#202020" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23E8D7C0'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%23000'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23E8D7C0'/%3E%3Ccircle cx='32' cy='32' r='1.6' fill='%23000'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://archive.org" crossorigin />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var t = localStorage.getItem("mv.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="logo" href="./" aria-label="Mystery Vinyl">
    <svg viewBox="63 38 288 245" aria-hidden="true">
      <rect x="63" y="77" width="288" height="206" rx="18" fill="#E8D7C0"/>
      <path d="M91 155 A117 117 0 0 1 325 155 Z" fill="#000"/>
      <circle cx="208" cy="155" r="40" fill="#E8D7C0"/>
      <circle cx="208" cy="152" r="5.5" fill="#000"/>
      <text x="76" y="215" font-size="54" font-weight="900" textLength="263" lengthAdjust="spacingAndGlyphs" fill="#000">MYSTERY</text>
      <text x="76" y="265" font-size="54" font-weight="900" textLength="165" lengthAdjust="spacingAndGlyphs" fill="#000">VINYL</text>
    </svg>
  </a>

  <nav class="topnav" aria-label="Site">
    <a class="nav-btn" href="https://github.com/ViggoZ/mystery-vinyl" target="_blank" rel="noopener" data-tip="Source on GitHub" aria-label="GitHub repository">
      <svg viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.35 1.09 2.92.83.09-.65.35-1.09.63-1.34-2.22-.25-4.56-1.11-4.56-4.95 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.6 9.6 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.85-2.34 4.7-4.57 4.94.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/></svg>
    </a>
    <button class="nav-btn" id="crackle" data-tip="Vinyl crackle · N" aria-label="Vinyl crackle" aria-pressed="true">
      <svg viewBox="0 0 24 24"><path d="M3 12h2l2-5 3 10 3-14 3 12 2-6 1 3h2"/></svg>
    </button>
    <button class="nav-btn" id="theme" data-tip="Light / dark · T" aria-label="Switch theme">
      <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ic-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
    <button class="nav-btn" id="zen" data-tip="Full screen · F" aria-label="Full screen">
      <svg class="ic-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <svg class="ic-collapse" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
    </button>
  </nav>

  <main class="stage">
    <section class="panel" aria-label="Now playing">
      <div class="modes-wrap">
        <div class="modes" role="tablist" aria-label="Mood" id="modes"></div>
        <div class="crate" id="crate" hidden>
          <form class="crate-form" id="crate-form">
            <input id="crate-input" type="url" placeholder="Paste a YouTube video, playlist or live link · an archive.org album · an mp3 or stream URL" autocomplete="off" spellcheck="false" required />
            <button class="crate-add" type="submit">Add</button>
          </form>
          <ul class="crate-list" id="crate-list"></ul>
          <p class="crate-note">Kept in this browser only. YouTube plays through a hidden player, so a few videos may refuse to play.</p>
        </div>
      </div>

      <canvas class="wave" id="wave" width="840" height="120" aria-hidden="true"></canvas>
      <div class="time"><span id="cur">00:00</span> / <span id="dur">00:00</span></div>
      <h1 class="title" id="title">Loading a record…</h1>
      <p class="artist" id="artist">&nbsp;</p>

      <div class="controls">
        <button class="btn" id="prev" title="Previous (←)" aria-label="Previous record">
          <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM19 5v14L9 12z"/></svg>
        </button>
        <button class="btn btn-main" id="play" title="Play / pause (space)" aria-label="Play">
          <svg class="ic-play" viewBox="0 0 24 24"><path d="M7 4v16l14-8z"/></svg>
          <svg class="ic-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
        </button>
        <button class="btn" id="next" title="Next mystery record (→)" aria-label="Next record">
          <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5v14l10-7z"/></svg>
        </button>
      </div>

      <p class="credit" id="credit"></p>
    </section>

    <section class="deck" aria-label="Turntable">
      <div class="turntable" id="turntable">
        <div class="plinth"></div>
        <div class="platter" id="platter"></div>
        <div class="record-slot">
          <div class="record" id="record">
            <div class="grooves"></div>
            <div class="label" id="label"></div>
            <div class="spindle"></div>
          </div>
          <div class="sheen"></div>
        </div>

        <button class="knob" id="knob" data-speed="33" title="33 / 45 rpm" aria-label="Speed selector"><span>33</span><i></i><span>45</span></button>
        <button class="power" id="power" aria-label="Start / stop platter"></button>

        <svg class="tonearm-svg" viewBox="0 0 840 680" aria-hidden="true">
          <defs>
            <linearGradient id="tube" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#2a2a2a"/><stop offset=".35" stop-color="#6a6a6a"/>
              <stop offset=".55" stop-color="#4a4a4a"/><stop offset="1" stop-color="#181818"/>
            </linearGradient>
            <radialGradient id="bearing" cx=".4" cy=".35" r=".8">
              <stop offset="0" stop-color="#4c4c4c"/><stop offset=".6" stop-color="#262626"/><stop offset="1" stop-color="#141414"/>
            </radialGradient>
            <radialGradient id="weight" cx=".35" cy=".3" r=".9">
              <stop offset="0" stop-color="#5a5a5a"/><stop offset="1" stop-color="#1a1a1a"/>
            </radialGradient>
          </defs>

          <!-- arm rest clip (static) -->
          <g class="armrest">
            <rect x="684" y="498" width="32" height="26" rx="6" fill="#151515" stroke="#2c2c2c" stroke-width="1"/>
            <path d="M690 504 v14 a4 4 0 0 0 4 4 h12 a4 4 0 0 0 4 -4 v-14" fill="none" stroke="#3a3a3a" stroke-width="2" stroke-linecap="round"/>
          </g>

          <!-- bearing housing (static) -->
          <circle cx="700" cy="150" r="66" fill="#171717" stroke="#2e2e2e" stroke-width="1.5"/>
          <circle cx="700" cy="150" r="50" fill="url(#bearing)" stroke="#3a3a3a" stroke-width="1"/>
          <path d="M660 195 A62 62 0 0 0 740 195" fill="none" stroke="#3a3a3a" stroke-width="2" stroke-linecap="round"/>

          <!-- the arm: rotates about (700,150) -->
          <g class="arm" id="arm">
          <g class="arm-wobble" id="armWobble">
            <!-- bearing top: turns with the arm but never lifts, so its shadow stays put -->
            <g class="arm-fixed">
              <circle cx="700" cy="150" r="30" fill="#2c2c2c" stroke="#111" stroke-width="1.5"/>
              <circle cx="700" cy="150" r="22" fill="#232323"/>
              <circle cx="700" cy="150" r="5" fill="#5a5a5a"/>
              <g transform="translate(748,150)">
                <circle r="15" fill="#2c2c2c" stroke="#111" stroke-width="1"/>
                <circle r="9" fill="none" stroke="#5a5a5a" stroke-width="1" stroke-dasharray="1 2"/>
              </g>
            </g>
            <!-- the part that lifts: counterweight, tube, headshell -->
            <g class="arm-lift">
            <rect x="686" y="48" width="28" height="44" rx="6" fill="url(#weight)" stroke="#111" stroke-width="1"/>
            <rect x="690" y="52" width="20" height="8" rx="2" fill="#1a1a1a"/>
            <!-- tube -->
            <rect x="695" y="90" width="10" height="470" rx="5" fill="url(#tube)"/>
            <rect x="693" y="440" width="14" height="40" rx="3" fill="#2e2e2e" stroke="#111" stroke-width="1"/>
            <!-- headshell -->
            <g transform="translate(700,560) rotate(-14)">
              <path d="M-9 0 L9 0 L13 52 L-13 52 Z" fill="#3a3a3a" stroke="#161616" stroke-width="1.2"/>
              <rect x="-11" y="36" width="22" height="20" rx="2" fill="#2a2a2a" stroke="#111" stroke-width="1"/>
              <rect x="-4" y="54" width="8" height="10" rx="1.5" fill="#d9b896"/>
              <path d="M-1 64 L0 70 L1 64 Z" fill="#eee"/>
              <circle cx="-6" cy="44" r="1.6" fill="#777"/><circle cx="6" cy="44" r="1.6" fill="#777"/>
            </g>
            </g>
          </g>
          </g>
        </svg>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span>© 2026 <a href="https://uiboy.com/" target="_blank" rel="noopener">UI Boy</a>. All rights reserved.</span>
    <span>Open source on <a href="https://github.com/ViggoZ/mystery-vinyl" target="_blank" rel="noopener">GitHub</a> · Created by viggo with ♥</span>
  </footer>

  <p class="hint" id="hint" hidden>Click anywhere to drop the needle</p>
  <p class="toast" id="toast" hidden></p>

  <div id="yt-shell" aria-hidden="true"></div>
  <audio id="audio" crossorigin="anonymous" preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
