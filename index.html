<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mystery Vinyl</title>
  <meta name="description" content="Drop the needle. Random records for coding, focus, thinking and designing." />
  <link rel="preconnect" href="https://archive.org" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="logo" href="./" aria-label="Mystery Vinyl">
    <svg viewBox="0 0 100 84" width="100" height="84" aria-hidden="true">
      <rect x="1" y="1" width="98" height="82" rx="8" fill="#e9d9c2" stroke="#c9b596" stroke-width="1.5"/>
      <path d="M22 44 A28 28 0 0 1 78 44 Z" fill="#1f1f1f"/>
      <circle cx="50" cy="44" r="3.2" fill="#e9d9c2"/>
      <text x="50" y="60" text-anchor="middle" font-size="12" font-weight="800" letter-spacing=".04em" fill="#1f1f1f">MYSTERY</text>
      <text x="50" y="73" text-anchor="middle" font-size="12" font-weight="800" letter-spacing=".06em" fill="#1f1f1f">VINYL</text>
    </svg>
  </a>

  <main class="stage">
    <section class="panel" aria-label="Now playing">
      <div class="modes" role="tablist" aria-label="Mood" id="modes"></div>

      <canvas class="wave" id="wave" width="840" height="120" aria-hidden="true"></canvas>
      <div class="time"><span id="cur">00:00</span> / <span id="dur">00:00</span></div>
      <h1 class="title" id="title">Loading a record…</h1>
      <p class="artist" id="artist">&nbsp;</p>

      <div class="controls">
        <button class="btn" id="prev" title="Previous (←)" aria-label="Previous record">
          <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM19 5v14L9 12z"/></svg>
        </button>
        <button class="btn btn-main" id="play" title="Play / pause (space)" aria-label="Play">
          <svg class="ic-play" viewBox="0 0 24 24"><path d="M7 4v16l14-8z"/></svg>
          <svg class="ic-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
        </button>
        <button class="btn" id="next" title="Next mystery record (→)" aria-label="Next record">
          <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5v14l10-7z"/></svg>
        </button>
        <label class="vol" title="Volume">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 8.5a4 4 0 0 1 0 7"/></svg>
          <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="Volume" />
        </label>
      </div>

      <p class="credit" id="credit"></p>
    </section>

    <section class="deck" aria-label="Turntable">
      <div class="turntable" id="turntable">
        <div class="plinth"></div>
        <div class="platter" id="platter"></div>
        <div class="record-slot">
          <div class="record" id="record">
            <div class="grooves"></div>
            <div class="label" id="label"></div>
            <div class="spindle"></div>
          </div>
          <div class="sheen"></div>
        </div>

        <div class="knob" title="33 / 45"><span>33</span><i></i><span>45</span></div>
        <button class="power" id="power" aria-label="Start / stop platter"></button>

        <svg class="tonearm-svg" viewBox="0 0 840 680" aria-hidden="true">
          <defs>
            <linearGradient id="tube" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#2a2a2a"/><stop offset=".35" stop-color="#6a6a6a"/>
              <stop offset=".55" stop-color="#4a4a4a"/><stop offset="1" stop-color="#181818"/>
            </linearGradient>
            <radialGradient id="bearing" cx=".4" cy=".35" r=".8">
              <stop offset="0" stop-color="#4c4c4c"/><stop offset=".6" stop-color="#262626"/><stop offset="1" stop-color="#141414"/>
            </radialGradient>
            <radialGradient id="weight" cx=".35" cy=".3" r=".9">
              <stop offset="0" stop-color="#5a5a5a"/><stop offset="1" stop-color="#1a1a1a"/>
            </radialGradient>
            <filter id="armShadow" x="-40%" y="-40%" width="180%" height="180%">
              <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity=".55"/>
            </filter>
          </defs>

          <!-- arm rest clip (static) -->
          <g class="armrest">
            <rect x="684" y="498" width="32" height="26" rx="6" fill="#151515" stroke="#2c2c2c" stroke-width="1"/>
            <path d="M690 504 v14 a4 4 0 0 0 4 4 h12 a4 4 0 0 0 4 -4 v-14" fill="none" stroke="#3a3a3a" stroke-width="2" stroke-linecap="round"/>
          </g>
          <!-- cue lever (static) -->
          <g class="cue">
            <rect x="770" y="128" width="26" height="8" rx="3" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="1"/>
            <rect x="790" y="122" width="8" height="20" rx="3" fill="#4a4a4a"/>
          </g>

          <!-- bearing housing (static) -->
          <circle cx="700" cy="150" r="66" fill="#171717" stroke="#2e2e2e" stroke-width="1.5"/>
          <circle cx="700" cy="150" r="50" fill="url(#bearing)" stroke="#3a3a3a" stroke-width="1"/>
          <path d="M660 195 A62 62 0 0 0 740 195" fill="none" stroke="#3a3a3a" stroke-width="2" stroke-linecap="round"/>

          <!-- the arm: rotates about (700,150) -->
          <g class="arm" id="arm" filter="url(#armShadow)">
            <!-- counterweight -->
            <rect x="686" y="48" width="28" height="44" rx="6" fill="url(#weight)" stroke="#111" stroke-width="1"/>
            <rect x="690" y="52" width="20" height="8" rx="2" fill="#1a1a1a"/>
            <!-- pivot cap -->
            <circle cx="700" cy="150" r="30" fill="#2c2c2c" stroke="#111" stroke-width="1.5"/>
            <circle cx="700" cy="150" r="22" fill="#232323"/>
            <circle cx="700" cy="150" r="5" fill="#5a5a5a"/>
            <!-- anti-skate dial -->
            <g transform="translate(748,150)">
              <circle r="15" fill="#2c2c2c" stroke="#111" stroke-width="1"/>
              <circle r="9" fill="none" stroke="#5a5a5a" stroke-width="1" stroke-dasharray="1 2"/>
            </g>
            <!-- tube -->
            <rect x="695" y="90" width="10" height="470" rx="5" fill="url(#tube)"/>
            <rect x="693" y="440" width="14" height="40" rx="3" fill="#2e2e2e" stroke="#111" stroke-width="1"/>
            <!-- headshell -->
            <g transform="translate(700,560) rotate(-14)">
              <path d="M-9 0 L9 0 L13 52 L-13 52 Z" fill="#3a3a3a" stroke="#161616" stroke-width="1.2"/>
              <rect x="-11" y="36" width="22" height="20" rx="2" fill="#2a2a2a" stroke="#111" stroke-width="1"/>
              <rect x="-4" y="54" width="8" height="10" rx="1.5" fill="#d9b896"/>
              <path d="M-1 64 L0 70 L1 64 Z" fill="#eee"/>
              <circle cx="-6" cy="44" r="1.6" fill="#777"/><circle cx="6" cy="44" r="1.6" fill="#777"/>
            </g>
          </g>
        </svg>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span>© 2026 UI Boy All rights reserved.</span>
    <span>Created by viggo with ♥</span>
  </footer>

  <p class="hint" id="hint" hidden>Click anywhere to drop the needle</p>

  <audio id="audio" crossorigin="anonymous" preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
